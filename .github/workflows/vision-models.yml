name: Qualify additional vision models
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked build dependencies
        run: |
          python -m pip install uv==0.13.7
          uv sync --frozen --extra dev
      - name: Linux native desktop and OCR runtime
        if: runner.os == 'Linux'
        run: bash scripts/ci_linux_runtime.sh tesseract-ocr tesseract-ocr-ara patchelf xvfb xauth
      - name: Windows OCR runtime
        if: runner.os == 'Windows'
        run: choco install tesseract --no-progress -y
      - name: Prepare source workspace and pinned vision models
        run: |
          uv run python -m scripts.prepare_runtime --best
          uv run python -m scripts.prepare_vision --preset smol-500m --preset internvl3-1b
      - name: Compile and verify the current standalone CPU JSON worker
        run: |
          uv run python -m scripts.build_vision_bridge --runner-pack models/vision/smol-500m/pack.json --output runtime/vision-bridge/qualification --jobs 2
          uv run python -m scripts.verify_vision_worker runtime/vision-bridge/qualification/vision_bridge.dist
      - name: Native CPU and relocated standalone-worker transcription
        run: uv run python -m scripts.probe_vision_packs --pack models/vision/smol-500m/pack.json --pack models/vision/internvl3-1b/pack.json --worker runtime/vision-bridge/qualification/vision_bridge.dist --output test-output/additional-vision/worker-models.json
      - name: Report supported and skipped accuracy fixtures
        run: |
          uv run python -m scripts.accuracy evaluate --edition studio --methods vision --backend cpu --model-pack models/vision/smol-500m/pack.json --output test-output/additional-vision/smol-500m-accuracy.json
          uv run python -m scripts.accuracy evaluate --edition studio --methods vision --backend cpu --model-pack models/vision/internvl3-1b/pack.json --output test-output/additional-vision/internvl3-1b-accuracy.json
      - name: Linux source and native-X11 clipboard resource workloads
        if: runner.os == 'Linux'
        env:
          OCREADY_GUI_TEST_PLATFORM: xcb
        run: |
          xvfb-run -a --server-args="-screen 0 1600x1200x24" uv run python -m scripts.benchmark --edition studio --vision-pack models/vision/smol-500m/pack.json --output test-output/additional-vision/smol-500m-resources.json
          xvfb-run -a --server-args="-screen 0 1600x1200x24" uv run python -m scripts.benchmark --edition studio --vision-pack models/vision/internvl3-1b/pack.json --output test-output/additional-vision/internvl3-1b-resources.json
      - name: Windows source and native-Win32 clipboard resource workloads
        if: runner.os == 'Windows'
        env:
          OCREADY_GUI_TEST_PLATFORM: windows
        run: |
          uv run python -m scripts.benchmark --edition studio --vision-pack models/vision/smol-500m/pack.json --output test-output/additional-vision/smol-500m-resources.json
          uv run python -m scripts.benchmark --edition studio --vision-pack models/vision/internvl3-1b/pack.json --output test-output/additional-vision/internvl3-1b-resources.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: additional-vision-${{ runner.os }}
          path: |
            test-output/additional-vision/*.json
            runtime/vision-bridge/qualification/vision_bridge.dist/vision-build.json
          if-no-files-found: warn
