name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install uv and locked dependencies
        run: |
          python -m pip install uv==0.13.7
          uv sync --frozen --extra dev
      - name: Install Linux OCR runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ara libegl1 libxcb-cursor0
      - name: Install Windows OCR runtime
        if: runner.os == 'Windows'
        run: choco install tesseract --no-progress -y
      - name: Prepare pinned language data
        run: uv run python scripts/prepare_runtime.py --best
      - name: Lint
        run: uv run ruff check .
      - name: Native UI and real bilingual OCR tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q --junitxml=test-output/results.xml
      - name: Headless real-engine smoke test
        run: uv run python -m ocready assets/sample-bilingual.png --json --layout sparse --output test-output/bilingual.json
      - name: Report bilingual transcription errors
        run: uv run python -m scripts.accuracy evaluate --output test-output/accuracy.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: checks-${{ runner.os }}
          path: test-output/
