name: Compile embedded neural editions
on:
  workflow_dispatch:
    inputs:
      edition:
        description: Memory edition
        required: true
        type: choice
        options: [everyday, studio]
        default: everyday
      variant:
        description: Included OCR methods
        required: true
        type: choice
        options: [neural, combined, multimodal, multimodal-json]
        default: neural
      publish:
        description: Publish a prerelease only after both platforms and every method pass
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python
        with:
          python-version: '3.12'
      - name: Install locked worker and build dependencies
        run: |
          python -m pip install uv==0.13.7
          uv sync --frozen --extra dev --extra neural
      - name: Linux runtime
        if: runner.os == 'Linux'
        run: bash scripts/ci_linux_runtime.sh tesseract-ocr tesseract-ocr-ara libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxkbcommon-x11-0 patchelf xvfb xauth
      - name: Windows runtime
        if: runner.os == 'Windows'
        run: choco install tesseract --no-progress -y
      - name: Prepare native containment and language assets
        run: uv run python -m scripts.prepare_runtime --best
      - name: Verify source and native UI
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q --tb=short
      - name: Restore an exact compiled neural worker
        id: worker-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: runtime/neural-runner/cpu/neural_runner.dist
          key: neural-worker-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('uv.lock', 'native/neural_runner.py', 'scripts/build_neural_runner.py', 'scripts/verify_neural_worker.py') }}
      - name: Compile standalone neural worker
        if: steps.worker-cache.outputs.cache-hit != 'true'
        run: uv run python -m scripts.build_neural_runner --jobs 2
      - name: Verify reusable worker source and file inventory
        run: uv run python -m scripts.verify_neural_worker runtime/neural-runner/cpu/neural_runner.dist
      - name: Prepare checksum-locked official model pack
        run: uv run python -m scripts.prepare_neural
      - name: Real compiled-worker bilingual accuracy
        run: uv run python -m scripts.accuracy evaluate --edition ${{ inputs.edition }} --methods neural --neural-pack models/ppocr-v5/pack.json --output test-output/neural-accuracy.json
      - name: Save the independently verified neural worker
        if: steps.worker-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: runtime/neural-runner/cpu/neural_runner.dist
          key: ${{ steps.worker-cache.outputs.cache-primary-key }}
      - name: Compile outer onefile application
        run: uv run python -m scripts.build_variant --edition ${{ inputs.edition }} --variant ${{ inputs.variant }} --jobs 2
      - name: Verify complete executable and X11 memory workloads
        if: runner.os == 'Linux'
        env:
          OCREADY_GUI_TEST_PLATFORM: xcb
        run: xvfb-run -a --server-args="-screen 0 1600x1200x24" uv run python -m scripts.smoke_binary dist/${{ inputs.edition }}-${{ inputs.variant }} --all-methods --benchmark
      - name: Verify complete executable and Win32 memory workloads
        if: runner.os == 'Windows'
        env:
          OCREADY_GUI_TEST_PLATFORM: windows
        run: uv run python -m scripts.smoke_binary dist/${{ inputs.edition }}-${{ inputs.variant }} --all-methods --benchmark
      - name: Retain failed-build layout diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OCReady-${{ inputs.edition }}-${{ inputs.variant }}-${{ runner.os }}-diagnostics
          path: |
            dist/${{ inputs.edition }}-${{ inputs.variant }}/pe-layout.json
            dist/${{ inputs.edition }}-${{ inputs.variant }}/qt-*-runtime.json
            dist/${{ inputs.edition }}-${{ inputs.variant }}/compilation-report.xml
            build/${{ inputs.edition }}-${{ inputs.variant }}/payload/build-manifest.json
            test-output/packaged-*.json
            test-output/cli-*.log
            test-output/gui-*.log
            test-output/gui-*.json
            test-output/gui-*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: OCReady-${{ inputs.edition }}-${{ inputs.variant }}-${{ runner.os }}
          path: |
            dist/${{ inputs.edition }}-${{ inputs.variant }}/OCReady-*
            dist/${{ inputs.edition }}-${{ inputs.variant }}/build-manifest.json
            dist/${{ inputs.edition }}-${{ inputs.variant }}/pe-layout.json
            dist/${{ inputs.edition }}-${{ inputs.variant }}/qt-*-runtime.json
            test-output/packaged-${{ inputs.edition }}-${{ inputs.variant }}-*.json
            test-output/neural-accuracy.json
            test-output/cli-*.log
            test-output/gui-*.log
            test-output/gui-*.json
            test-output/gui-*.png
          if-no-files-found: error
  release:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify both platforms and complete per-method evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts
          python -m scripts.release_variants --artifacts artifacts --output dist/release --revision "$GITHUB_SHA" --edition "${{ inputs.edition }}" --variant "${{ inputs.variant }}" --run-id "$GITHUB_RUN_ID"
      - name: Publish experimental model variant
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0-${{ inputs.edition }}-${{ inputs.variant }}-preview.${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "OCReady ${{ inputs.edition }} ${{ inputs.variant }} preview" --notes-file dist/release/RELEASE-NOTES.md dist/release/*
