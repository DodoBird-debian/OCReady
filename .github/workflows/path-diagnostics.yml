name: Diagnose native Windows OCR paths
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare source probe
        run: |
          python -m pip install uv==0.13.7
          uv sync --frozen --extra dev
          choco install tesseract --no-progress -y
          uv run python -m scripts.prepare_runtime
      - name: Exercise actual source workers with Arabic paths
        run: uv run python -m scripts.diagnose_windows_paths --output test-output/windows-paths.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-path-diagnostics
          path: test-output/windows-paths.json
          if-no-files-found: warn
