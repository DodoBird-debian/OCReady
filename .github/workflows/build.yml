name: Compile onefile editions
on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edition to compile
        required: true
        type: choice
        options: [all, pocket, everyday, studio]
        default: all
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        edition: [pocket, everyday, studio]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install build environment
        run: |
          python -m pip install uv==0.13.7
          uv sync --frozen --extra dev
      - name: Linux runtime
        if: runner.os == 'Linux'
        run: bash scripts/ci_linux_runtime.sh tesseract-ocr tesseract-ocr-ara libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxkbcommon-x11-0 patchelf xvfb xauth
      - name: Windows runtime
        if: runner.os == 'Windows'
        run: choco install tesseract --no-progress -y
      - name: Prepare runtime
        run: uv run python scripts/prepare_runtime.py --best
      - name: Verify before compilation
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q
      - name: Compile selected edition
        if: github.event_name != 'workflow_dispatch' || inputs.edition == 'all' || inputs.edition == matrix.edition
        run: uv run python scripts/build.py --edition ${{ matrix.edition }} --jobs 2
      - name: Smoke-test compiled binary on X11
        if: runner.os == 'Linux' && (github.event_name != 'workflow_dispatch' || inputs.edition == 'all' || inputs.edition == matrix.edition)
        env:
          OCREADY_GUI_TEST_PLATFORM: xcb
        run: xvfb-run -a --server-args="-screen 0 1600x1200x24" uv run python scripts/smoke_binary.py dist/${{ matrix.edition }} --benchmark
      - name: Smoke-test compiled binary on Win32
        if: runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || inputs.edition == 'all' || inputs.edition == matrix.edition)
        env:
          OCREADY_GUI_TEST_PLATFORM: windows
        run: uv run python scripts/smoke_binary.py dist/${{ matrix.edition }} --benchmark
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure() && (github.event_name != 'workflow_dispatch' || inputs.edition == 'all' || inputs.edition == matrix.edition)
        with:
          name: OCReady-${{ matrix.edition }}-${{ runner.os }}-diagnostics
          path: |
            dist/${{ matrix.edition }}/pe-layout.json
            dist/${{ matrix.edition }}/qt-*-runtime.json
            dist/${{ matrix.edition }}/compilation-report.xml
            build/${{ matrix.edition }}/payload/build-manifest.json
            test-output/packaged-${{ matrix.edition }}.json
            test-output/cli-*.log
            test-output/gui-*.log
            test-output/gui-*.json
            test-output/gui-*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name != 'workflow_dispatch' || inputs.edition == 'all' || inputs.edition == matrix.edition
        with:
          name: OCReady-${{ matrix.edition }}-${{ runner.os }}
          path: |
            dist/${{ matrix.edition }}/OCReady-*
            dist/${{ matrix.edition }}/build-manifest.json
            dist/${{ matrix.edition }}/pe-layout.json
            dist/${{ matrix.edition }}/qt-*-runtime.json
            test-output/packaged-${{ matrix.edition }}.json
            test-output/cli-*.log
            test-output/gui-*.log
            test-output/gui-*.json
            test-output/gui-*.png
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact build and resource evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts
          python -m scripts.release_assets --artifacts artifacts --output dist/release --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "OCReady $GITHUB_REF_NAME" --notes-file dist/release/RELEASE-NOTES.md dist/release/*
