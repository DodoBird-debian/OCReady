name: Diagnose native Windows vision exits
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare diagnostic controller
        run: |
          python -m pip install uv==0.13.7
          uv sync --frozen --extra dev
      - name: Retrieve the passing public reference without compiling a new app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.0-studio-multimodal-preview.19 --repo "$env:GITHUB_REPOSITORY" --pattern OCReady-studio-multimodal-windows-amd64.exe --pattern OCReady-studio-multimodal-windows-amd64.exe.sha256 --dir test-output/reference
      - name: Observe actual descendant native exit statuses
        run: uv run python -m scripts.probe_windows_vision --binary test-output/reference/OCReady-studio-multimodal-windows-amd64.exe --checksum test-output/reference/OCReady-studio-multimodal-windows-amd64.exe.sha256 --output test-output/windows-native-vision.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-native-vision-diagnostics
          path: test-output/windows-native-vision.json
          if-no-files-found: warn
