[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ocready"
version = "0.1.0"
description = "A calm, local-first Arabic and English OCR workspace"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-or-later"
dependencies = [
  "PySide6-Essentials>=6.8,<6.9",
  "Pillow>=11.3,<13",
  "psutil>=7,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "nuitka>=2.8,<5", "ordered-set>=4", "zstandard>=0.23", "patchelf>=0.17; sys_platform == 'linux'"]
cuda-build = ["cmake>=3.28,<4", "ninja>=1.11,<2"]

[project.scripts]
ocready = "ocready.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["ocready"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
